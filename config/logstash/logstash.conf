input {
  beats {
    port => 5044
  }
}
filter {
  # Example: Parse Nginx access logs (adjust based on your logging source)
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "http-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}